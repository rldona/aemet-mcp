name: Publish to npm

# Publica @rldona/aemet-mcp en npm mediante TRUSTED PUBLISHING (OIDC): sin token.
# GitHub Actions presenta un token OIDC que npm verifica contra el "Trusted
# Publisher" configurado en el paquete, así que NO se necesita NPM_TOKEN y la
# publicación es directa (sin staging), con provenance automática.
#
# Requisito de una sola vez (en npmjs.com, página del paquete -> Settings ->
# Trusted Publisher): enlazar el paquete a este repo y a este workflow:
#   Publisher: GitHub Actions
#   Organization or user: rldona
#   Repository: aemet-mcp
#   Workflow filename: publish.yml

on:
  release:
    types: [published]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # imprescindible para OIDC + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Trusted Publishing (OIDC) requiere npm >= 11.5.1; el que trae Node aún es
      # 10.x, así que lo actualizamos. Versión FIJA, no `@latest`: este job tiene
      # permiso de publicación vía OIDC, y `@latest` metería automáticamente
      # cualquier versión de npm recién publicada, comprometida incluida.
      # Dependabot no cubre esto, así que se sube a mano al revisar la release.
      - name: Instala la versión de npm con soporte OIDC
        run: npm install -g npm@12.0.2

      - run: npm ci

      - name: Verifica que el tag coincide con la versión del package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::El tag ($TAG) no coincide con package.json ($PKG)"
            exit 1
          fi

      # El build va ANTES de los tests: el smoke test del servidor MCP arranca
      # dist/index.js como proceso hijo.
      - name: Typecheck + build + tests
        run: |
          npm run typecheck
          npm run build
          npm test

      # Última red antes de publicar: valida el tarball tal y como lo recibirá
      # quien lo instale (resolución ESM/CJS, tipos, binario, arranque MCP).
      - name: Validar el paquete empaquetado
        run: npm run test:pack

      # Sin NODE_AUTH_TOKEN: npm se autentica por OIDC contra el Trusted Publisher.
      # `--provenance` es necesario para adjuntar la atestación (no es automática).
      - name: Publish (OIDC + provenance)
        run: npm publish --provenance
