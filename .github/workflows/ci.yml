name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    name: test (Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # El build va ANTES de los tests: el smoke test del servidor MCP arranca
      # dist/index.js como proceso hijo.
      - name: Build
        run: npm run build

      - name: Tests (unitarios; los de integración se saltan sin AEMET_API_KEY)
        run: npm test

